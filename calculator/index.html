<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="calc" aria-label="Calculator">
  <div class="screen" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="clr" data-act="clear">AC</button>
    <button data-act="back" aria-label="Delete last digit">⌫</button>
    <button data-act="percent">%</button>
    <button class="op" data-op="/" aria-label="Divide">÷</button>

    <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
    <button class="op" data-op="*" aria-label="Multiply">×</button>

    <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
    <button class="op" data-op="-" aria-label="Subtract">−</button>

    <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
    <button class="op" data-op="+" aria-label="Add">+</button>

    <button class="zero" data-num="0">0</button>
    <button data-act="dot">.</button>
    <button class="op" data-act="equals">=</button>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
